stm32:
  reset: false

testbed:
  id: track

tracker:
  enabled: true
  server: palantir.lan

joystick:
  enabled: true

sound:
  volume: 0.25
  voice: robot  # female, male, or robot

control:
  auto_position_mode: true  # auto-switch to POSITION when calling move_to/turn_to wrappers

paths:
  main: '~/robot'

misc:
  warn_on_sample_batching: true

