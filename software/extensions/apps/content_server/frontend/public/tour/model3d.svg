<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="0 0 500 300">
  <rect width="500" height="300" rx="12" fill="#111"/>
  <g transform="translate(250,125)" stroke="#0ea5e9" fill="none" stroke-width="2">
    <!-- Front face -->
    <polygon points="-55,30 -55,-55 55,-55 55,30" fill="#0ea5e9" fill-opacity="0.05"/>
    <!-- Top face -->
    <polygon points="-55,-55 0,-90 110,-90 55,-55" fill="#0ea5e9" fill-opacity="0.1"/>
    <!-- Right face -->
    <polygon points="55,-55 110,-90 110,-5 55,30" fill="#0ea5e9" fill-opacity="0.08"/>
    <!-- Edges -->
    <line x1="-55" y1="30" x2="-55" y2="-55"/>
    <line x1="-55" y1="-55" x2="55" y2="-55"/>
    <line x1="55" y1="-55" x2="55" y2="30"/>
    <line x1="-55" y1="30" x2="55" y2="30"/>
    <line x1="-55" y1="-55" x2="0" y2="-90"/>
    <line x1="55" y1="-55" x2="110" y2="-90"/>
    <line x1="0" y1="-90" x2="110" y2="-90"/>
    <line x1="55" y1="30" x2="110" y2="-5"/>
    <line x1="110" y1="-90" x2="110" y2="-5"/>
    <!-- Internal lines -->
    <line x1="-55" y1="-55" x2="55" y2="30" stroke-dasharray="4,4" opacity="0.3"/>
    <line x1="55" y1="-55" x2="-55" y2="30" stroke-dasharray="4,4" opacity="0.3"/>
  </g>
  <!-- Rotation arrows -->
  <path d="M120,200 A40,40 0 0,1 158,172" stroke="#0ea5e9" stroke-width="1.5" fill="none" opacity="0.5"/>
  <polygon points="158,172 152,182 162,180" fill="#0ea5e9" opacity="0.5"/>
  <path d="M380,200 A40,40 0 0,0 342,172" stroke="#0ea5e9" stroke-width="1.5" fill="none" opacity="0.5"/>
  <polygon points="342,172 348,182 338,180" fill="#0ea5e9" opacity="0.5"/>
  <!-- Cursor -->
  <g transform="translate(290,160)" fill="#0ea5e9" opacity="0.4">
    <path d="M0,0 L0,18 L5,14 L10,22 L14,20 L9,12 L15,10 Z"/>
  </g>
  <text x="250" y="270" text-anchor="middle" fill="#555" font-family="system-ui,sans-serif" font-size="13">3D Model</text>
</svg>
