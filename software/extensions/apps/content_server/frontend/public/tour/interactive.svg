<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="0 0 500 300">
  <rect width="500" height="300" rx="12" fill="#111"/>
  <!-- Simulation window -->
  <rect x="40" y="25" width="420" height="220" rx="8" fill="#0d0d0d" stroke="#22c55e" stroke-width="2"/>
  <!-- Grid lines -->
  <line x1="60" y1="225" x2="440" y2="225" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="60" y1="185" x2="440" y2="185" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="60" y1="145" x2="440" y2="145" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="60" y1="105" x2="440" y2="105" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="60" y1="65" x2="440" y2="65" stroke="#1a1a1a" stroke-width="1"/>
  <!-- Waveform / signal -->
  <polyline points="60,165 90,145 120,170 150,120 180,140 210,90 240,110 270,70 300,95 330,80 360,105 390,85 420,100 440,95"
    fill="none" stroke="#22c55e" stroke-width="2.5" opacity="0.8"/>
  <!-- Second signal -->
  <polyline points="60,195 90,200 120,180 150,190 180,175 210,185 240,160 270,170 300,150 330,165 360,145 390,155 420,140 440,148"
    fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.4" stroke-dasharray="4,3"/>
  <!-- Play/pause controls -->
  <circle cx="250" cy="210" r="10" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.4"/>
  <polygon points="247,205 247,215 255,210" fill="#22c55e" opacity="0.4"/>
  <!-- Slider -->
  <rect x="100" y="37" width="120" height="4" rx="2" fill="#222"/>
  <rect x="100" y="37" width="70" height="4" rx="2" fill="#22c55e" opacity="0.5"/>
  <circle cx="170" cy="39" r="4" fill="#22c55e" opacity="0.6"/>
  <text x="85" y="42" fill="#22c55e" font-family="system-ui,sans-serif" font-size="9" opacity="0.5">t=2.4s</text>
  <text x="250" y="270" text-anchor="middle" fill="#555" font-family="system-ui,sans-serif" font-size="13">Interactive Example</text>
</svg>
