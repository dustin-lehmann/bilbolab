id: balance_test
description: Enable balancing mode, hold for a duration, then disable
timeout: 30.0
requirements:
  control_mode: "OFF"
actions:
  - type: beep
    frequency: 800
    duration: 0.2
  - type: set_mode
    mode: BALANCING
  - type: log
    message: "Balancing enabled"
  - type: wait_time
    time: "10.0"
  - type: set_mode
    mode: "OFF"
  - type: log
    message: "Balancing disabled"
  - type: beep
    frequency: 400
    duration: 0.3
