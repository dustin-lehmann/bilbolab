id: move_to_point
description: Navigate to a single target position using position control
timeout: 60.0
requirements:
  optitrack: true
  control_mode: "OFF"
variables:
  target_x: "1.0"
  target_y: "0.5"
actions:
  - type: set_mode
    mode: BALANCING
  - type: wait_time
    time: "2.0"
  - type: set_mode
    mode: POSITION
  - type: speak
    text: "Moving to target"
  - type: move_to
    x: "${target_x}"
    y: "${target_y}"
    timeout: 30.0
  - type: beep
    frequency: 1000
    duration: 0.3
  - type: set_mode
    mode: "OFF"
  - type: speak
    text: "Target reached"
