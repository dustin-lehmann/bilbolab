id: balance_hold
description: Enable balancing and hold for a configurable duration
timeout: 60.0
requirements:
  control_mode: "OFF"
variables:
  duration: "10.0"
guards:
  - type: disable_external_input
  - type: zero_input
actions:
  - type: beep
    frequency: 800
    duration: 0.2
  - type: set_mode
    mode: BALANCING
  - type: wait_time
    time: "${duration}"
  - type: set_mode
    mode: "OFF"
  - type: beep
    frequency: 400
    duration: 0.3
