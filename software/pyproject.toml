[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bilbolab"
version = "2.0.0"
description = "BilboLab – Robotics framework for BILBO two-wheel inverted pendulum robots"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "orjson~=3.10.11",
    "cobs~=1.2.1",
    "numpy~=2.3.1",
    "scipy~=1.15.2",
    "paramiko~=3.5.0",
    "dacite~=1.9.2",
    "rich~=14.0.0",
    "matplotlib~=3.10.0",
    "websocket-server~=0.6.4",
    "websocket-client~=1.8.0",
    "zeroconf~=0.146.3",
    "requests~=2.32.3",
    "psutil~=7.0.0",
    "pillow~=11.1.0",
    "Flask~=3.1.1",
    "flask-cors~=6.0.1",
    "Flask-SocketIO~=5.5.1",
    "pandas~=2.2.3",
    "aiohttp~=3.11.13",
    "networkx~=3.4.2",
    "graphviz~=0.20.3",
]

[project.optional-dependencies]
full = [
    "pyttsx3~=2.98",
    "pygame~=2.6.1",
    "pydub~=0.25.1",
    "prompt_toolkit~=3.0.48",
    "qmt~=0.2.4",
    "NatNetClient~=0.8.3",
    "gTTS~=2.5.4",
    "edge-tts~=7.0.0",
    "textual~=3.0.0",
    "pynput~=1.8.1",
    "control~=0.10.1",
    "simpy~=4.1.1",
    "elevate~=0.1.3",
    "streamdeck~=0.9.6",
    "intelhex~=2.3.0",
    "seaborn~=0.13.2",
    "ipywidgets~=8.1.7",
]

[tool.setuptools.packages.find]
include = [
    "core*",
    "extensions*",
    "robots*",
    "simulation*",
    "research*",
    "projects*",
]
exclude = [
    "__pycache__",
    "*.egg-info",
]

[tool.setuptools.package-data]
"*" = [
    "*.yaml",
    "*.yml",
    "*.json",
    "*.html",
    "*.css",
    "*.js",
    "*.vue",
    "*.png",
    "*.jpg",
    "*.svg",
    "*.wav",
    "*.mp3",
]
