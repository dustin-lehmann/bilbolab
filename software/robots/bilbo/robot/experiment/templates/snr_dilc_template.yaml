id: snr_dilc_test
description: Template SNR-adaptive DILC experiment (single agent, model-free)

# Number of learning trials (iterations). Typical: 5-30.
J: 10

# Sample period in seconds (must match the firmware control loop, 100 Hz -> 0.01).
Ts: 0.01

# Desired output trajectory (theta/pitch). Path to a .botrj file or inline array.
# Length must be a multiple of 10 (STM32 sequencer requirement).
reference: bumped_reference.botrj

# Starting pose the robot navigates to before each trial.
initial_conditions:
  x: 0.0
  y: 0.0
  psi: 0.0

# ============================================================================
# SNR-adaptive NO-ILC input update (replaces the base DILC ilc_gain + the FIR
# input_lowpass). Each trial:
#   sigma_n = ||e_iml|| / sqrt(N)                                (noise est.)
#   s_snr   = clip( c_snr * sigma_n^2 * N / ||e_ilc||^2, s_min, s_max )
#   s_j     = max( s_snr, s_warm * warm_decay^j )                (warm-up)
#   L       = (M^T M + (s_j + r) I)^-1 M^T                       (NO-ILC gain)
#   Q       = (M^T M + (s_j + r) I)^-1 (M^T M + s_j I)           (Q-filter from r)
#   u_{j+1} = Q (u_j + L e_ilc)
# ============================================================================

# SNR regulariser scale. Larger -> more regularisation (more conservative,
# noise-robust). Typical: 0.05-0.3.
c_snr: 0.1

# Bounds on the SNR-adaptive regulariser s.
s_min: 0.0001
s_max: 10.0

# Warm-up regulariser floor: keeps the first few trials conservative until the
# model is identified, then fades geometrically. s_warm is the floor at trial 0;
# warm_decay is the per-trial decay factor. Set s_warm: 0.0 to disable.
s_warm: 0.3
warm_decay: 0.4

# Input-magnitude weight r -> NO-ILC Q-filter that low-passes / attenuates the
# learnt input and damps high-frequency noise. 0.0 = no Q-filter. Typical when
# used: 1e-4 .. 1e-2.
r: 0.0

# IML model Q-filter (unchanged from the base DILC) — smooths the identified
# impulse-response model update across trials.
#   fc: cutoff (cycles/sample, 0 < fc < 0.5); L: FIR length (odd); window.
model_lowpass:
  fc: 0.4
  L: 41
  window: hann

# IML regularization gain. Typical: 1.0-3.0.
# iml_gain: 1.5

# Initial input trajectory u0 (path to .bitrj or inline array). If omitted, a
# random trajectory is generated from u0_params. A short impulse-style kick is a
# good first excitation for the online identification.
# u0: my_input.bitrj
u0_params:
  f_cutoff: 1.5
  sigma: 0.2
  bias: -0.03

# Initial model m0 (path to .bmvec or inline array). If omitted, starts at zero.
# m0: my_model.bmvec

meta:
  automatic_initial_conditions_reset: true
  check_if_robot_is_static: true
  auto_start_trials: false
  auto_accept_trials: false
  enable_psi_control: false
  disable_tracker_during_trajectory: false
