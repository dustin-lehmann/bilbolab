id: waypoint_square
description: Navigate a square path using position control waypoints
timeout: 120.0
requirements:
  optitrack: true
  control_mode: "OFF"
guards:
  - type: disable_external_input
  - type: zero_input
actions:
  - type: set_mode
    mode: BALANCING
  - type: wait_time
    time: "2.0"
  - type: set_mode
    mode: POSITION
  - type: speak
    text: "Starting square path"
  - type: move_to
    x: 1.0
    y: 0.0
    timeout: 15.0
  - type: move_to
    x: 1.0
    y: 1.0
    timeout: 15.0
  - type: move_to
    x: 0.0
    y: 1.0
    timeout: 15.0
  - type: move_to
    x: 0.0
    y: 0.0
    timeout: 15.0
  - type: set_mode
    mode: "OFF"
  - type: speak
    text: "Square path complete"
